# Netlify Build & Deploy Configuration (for when Base Directory is set to 'client')

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_DEMO_MODE = "true"

# Redirect all frontend routes to index.html for Single Page Application (SPA) routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
