version: "2.4.0"
info:
  title: "ProjectFlow API Specification"
  description: "REST API documentation for the ProjectFlow academic project platform, including student, faculty, coordinator, and institution workflows."
  feature: "Coordinator Portal: Institution and Academic Setup"
  lastUpdated: "2026-10-27"

# ========================================================
# 1. API CATEGORIZATION SUMMARY
# ========================================================
summary:
  existingApisReused:
    - path: "/api/auth/login"
      method: "POST"
      service: "auth-service"
      description: "Authenticates students, faculty, and administrators; generates 24h JWT token."
    - path: "/api/auth/register"
      method: "POST"
      service: "auth-service"
      description: "Registers Student and Faculty accounts, or creates the first Coordinator account together with its institution profile."
    - path: "/api/auth/me"
      method: "GET"
      service: "auth-service"
      description: "Validates current token and returns active user persona profile."
    - path: "/api/courses"
      method: "GET"
      service: "project-service"
      description: "Fetches authorized academic courses for the authenticated user with search filtering."
    - path: "/api/courses/{id}"
      method: "GET"
      service: "project-service"
      description: "Fetches complete course syllabus, faculty metadata, instructor message, and resource lists."
    - path: "/api/courses/broadcasts"
      method: "GET"
      service: "project-service"
      description: "Aggregates faculty broadcast announcements across all authorized courses for the student dashboard."

  newApisIntroduced:
    - path: "/api/courses/{id}/announcements"
      method: "GET"
      service: "project-service"
      description: "Lists announcements for a specific course with optional query filters (search, unreadOnly, pinnedOnly), ordered with pinned announcements first. Accessible by enrolled students without team membership."
    - path: "/api/courses/{id}/announcements/{announcementId}"
      method: "GET"
      service: "project-service"
      description: "Fetches details of a specific faculty announcement with calculated read/unread status for the user."
    - path: "/api/courses/{id}/announcements"
      method: "POST"
      service: "project-service"
      description: "Allows assigned faculty or administrators to publish a new broadcast announcement with optional attachments and pinned/important flags. Students receive 403 Forbidden."
    - path: "/api/courses/{id}/announcements/{announcementId}"
      method: "PUT"
      service: "project-service"
      description: "Allows assigned faculty or administrators to update title, body, pinned/important flags, or attachments. Students receive 403 Forbidden."
    - path: "/api/courses/{id}/announcements/{announcementId}"
      method: "DELETE"
      service: "project-service"
      description: "Allows assigned faculty or administrators to delete an announcement. Students receive 403 Forbidden."
    - path: "/api/courses/{id}/announcements/{announcementId}/read"
      method: "PUT"
      service: "project-service"
      description: "Allows enrolled students and faculty to toggle or mark an announcement as read or unread."
    - path: "/api/courses/{id}/attachments/{filename}"
      method: "GET"
      service: "project-service"
      description: "Streams course documents and announcement attachments (PDF/Word/ZIP). Enforces course enrollment authorization (non-enrolled users receive 403 Forbidden)."
    - path: "/api/courses/{id}/teams"
      method: "GET"
      service: "project-service"
      description: "Returns list of project teams for the selected course with member capacity, user membership status (Available, Full, Joined), and members list. Does not require the caller to belong to a team."
    - path: "/api/courses/{id}/my-team"
      method: "GET"
      service: "project-service"
      description: "Fetches the authenticated user's current team in the specified course, returning { team: null } if the student is not currently in a team."
    - path: "/api/courses/{id}/teams"
      method: "POST"
      service: "project-service"
      description: "Creates a new course team after validating team size (4-5), unique team name, roll number & institutional email verification against auth database, batch matching, course enrollment, and single-team membership."
    - path: "/api/courses/{id}/teams/{teamId}/join"
      method: "POST"
      service: "project-service"
      description: "Allows an eligible, unassigned enrolled student from the same batch to join an open team in the course (capacity < 5)."
    - path: "/api/courses/{id}/teams/{teamId}/leave"
      method: "POST"
      service: "project-service"
      description: "Allows a member to leave their current team in the course. Reassigns team leadership if the leader departs, or deletes the team if empty."

  existingApisModified:
    - path: "/api/courses*"
      component: "API Gateway (gateway/server.js)"
      type: "Attachment Binary Streaming Support"
      description: "Enhanced Gateway proxyRequest to detect attachment download routes, request arraybuffer from microservice, and forward Content-Disposition and Content-Type headers while handling error JSON."

  apisCandidatesForDeprecation:
    - path: "/api/projects"
      method: "GET"
      reason: "Course scoping required in future steps (?courseId=...) rather than global root-level listing."

# ========================================================
# 2. DETAILED ENDPOINT CONTRACTS
# ========================================================
endpoints:

  # ------------------------------------------------------
  # GET /api/courses/{id}/announcements
  # ------------------------------------------------------
  - path: "/api/courses/{id}/announcements"
    method: "GET"
    category: "New API Introduced (Step 2)"
    service: "project-service"
    summary: "List announcements for a course"
    description: "Returns broadcast announcements for the specified course. Team membership is NOT a prerequisite. Supports search, unread, and pinned filters. Pinned announcements sort first."
    authentication:
      required: true
      type: "Bearer JWT"
      header: "Authorization: Bearer <token>"
    authorization:
      rules:
        - role: "Student"
          rule: "Must be enrolled in the course (email in enrolledEmails or ID in enrolledStudentIds). Team membership not required."
        - role: "Faculty"
          rule: "Must be assigned instructor for the course or Admin."
        - role: "Non-enrolled Student"
          rule: "HTTP 403 Forbidden."
    pathParams:
      - name: "id"
        type: "string"
        required: true
        description: "Course code (e.g. 'CS543') or course ID (e.g. 'course_cs543')."
    queryParams:
      - name: "search"
        type: "string"
        required: false
        description: "Case-insensitive query matching title, message content, or instructor name."
      - name: "unreadOnly"
        type: "boolean"
        required: false
        description: "If 'true', filters only announcements not yet read by the user."
      - name: "pinnedOnly"
        type: "boolean"
        required: false
        description: "If 'true', returns only pinned announcements."
    responses:
      200:
        description: "List of course announcements"
        example:
          - id: "ann_cs543_team_guidelines"
            courseId: "course_cs543"
            courseCode: "CS543"
            courseName: "Web Services"
            title: "Project Team Formation Guidelines"
            content: "• Each team must contain 4–5 students.\n• All members must belong to the same academic batch (2026-2028).\n• Every member must have a unique roll number and institutional email.\n• Each student can belong to only one team in the course.\n• Students must select a topic from the faculty-approved list in Resources.\n• Project proposals must be submitted before the faculty-defined deadline (25 Oct 2026)."
            facultyName: "Dr. R. Sharma"
            facultyEmail: "dr.sharma@projectflow.edu"
            isPinned: true
            isImportant: true
            publishedAt: "2026-10-20T10:00:00.000Z"
            date: "20 Oct 2026, 10:00 AM"
            attachments:
              - id: "att_guidelines_pdf"
                name: "Project_Guidelines.pdf"
                size: "2.4 MB"
                type: "pdf"
                downloadUrl: "/api/courses/CS543/attachments/Project_Guidelines.pdf"
            readBy:
              - "alex.chen@student.edu"
            isRead: false
      403:
        description: "Access denied. Student is not enrolled in the course."
        example:
          error: "Access denied. You are not enrolled in CS543 - Web Services."
      404:
        description: "Course not found"
        example:
          error: "Course 'CS999' not found"

  # ------------------------------------------------------
  # GET /api/courses/{id}/announcements/{announcementId}
  # ------------------------------------------------------
  - path: "/api/courses/{id}/announcements/{announcementId}"
    method: "GET"
    category: "New API Introduced (Step 2)"
    service: "project-service"
    summary: "Get single announcement details"
    description: "Returns announcement data with computed isRead status for caller."
    authentication:
      required: true
      type: "Bearer JWT"
    authorization:
      rules:
        - role: "Student"
          rule: "Enrolled students can view. 403 Forbidden for non-enrolled students."
    responses:
      200:
        description: "Announcement details"
        example:
          id: "ann_cs543_team_guidelines"
          title: "Project Team Formation Guidelines"
          content: "Each team must contain 4–5 students..."
          facultyName: "Dr. R. Sharma"
          isPinned: true
          isRead: false
      404:
        example:
          error: "Announcement 'ann_123' not found"

  # ------------------------------------------------------
  # POST /api/courses/{id}/announcements
  # ------------------------------------------------------
  - path: "/api/courses/{id}/announcements"
    method: "POST"
    category: "New API Introduced (Step 2)"
    service: "project-service"
    summary: "Publish course broadcast announcement"
    description: "Publishes a new announcement. Restricted to faculty assigned to the course and administrators. Students cannot publish."
    authentication:
      required: true
      type: "Bearer JWT"
    authorization:
      rules:
        - role: "Student"
          rule: "HTTP 403 Forbidden. Students cannot create or broadcast announcements."
        - role: "Faculty"
          rule: "Allowed only if faculty is assigned to this course."
        - role: "Admin"
          rule: "Allowed across all courses."
    requestBody:
      contentType: "application/json"
      required: true
      example:
        title: "Project Team Formation Guidelines"
        content: "• Each team must contain 4–5 students.\n• Submit proposals before deadline."
        isPinned: true
        isImportant: true
        attachments:
          - name: "Project_Guidelines.pdf"
            size: "2.4 MB"
            type: "pdf"
    responses:
      201:
        description: "Announcement created successfully"
        example:
          id: "ann_1730000000000"
          title: "Project Team Formation Guidelines"
          courseCode: "CS543"
          facultyName: "Dr. R. Sharma"
          isPinned: true
          publishedAt: "2026-10-26T21:00:00.000Z"
      400:
        example:
          error: "Announcement title is required"
      403:
        example:
          error: "Access forbidden: insufficient permissions. Role 'Student' is not allowed."

  # ------------------------------------------------------
  # PUT /api/courses/{id}/announcements/{announcementId}
  # ------------------------------------------------------
  - path: "/api/courses/{id}/announcements/{announcementId}"
    method: "PUT"
    category: "New API Introduced (Step 2)"
    service: "project-service"
    summary: "Update course announcement"
    description: "Modifies announcement content, pinned flag, or attachments. Restricted to Faculty/Admin."
    authentication:
      required: true
      type: "Bearer JWT"
    authorization:
      rules:
        - role: "Student"
          rule: "HTTP 403 Forbidden. Students cannot modify announcements."
    requestBody:
      contentType: "application/json"
      required: true
      example:
        title: "Updated Guidelines"
        content: "Extended deadline to 28 Oct."
        isPinned: true
    responses:
      200:
        description: "Announcement updated successfully"
      403:
        example:
          error: "Access forbidden: insufficient permissions"

  # ------------------------------------------------------
  # DELETE /api/courses/{id}/announcements/{announcementId}
  # ------------------------------------------------------
  - path: "/api/courses/{id}/announcements/{announcementId}"
    method: "DELETE"
    category: "New API Introduced (Step 2)"
    service: "project-service"
    summary: "Delete course announcement"
    description: "Deletes an announcement from the course feed. Restricted to Faculty/Admin."
    authentication:
      required: true
      type: "Bearer JWT"
    authorization:
      rules:
        - role: "Student"
          rule: "HTTP 403 Forbidden. Students cannot delete announcements."
    responses:
      200:
        example:
          message: "Announcement deleted successfully"
          announcementId: "ann_123"

  # ------------------------------------------------------
  # PUT /api/courses/{id}/announcements/{announcementId}/read
  # ------------------------------------------------------
  - path: "/api/courses/{id}/announcements/{announcementId}/read"
    method: "PUT"
    category: "New API Introduced (Step 2)"
    service: "project-service"
    summary: "Mark announcement as read or unread"
    description: "Updates readBy registry for the authenticated student or faculty member."
    authentication:
      required: true
      type: "Bearer JWT"
    authorization:
      rules:
        - role: "Student"
          rule: "Allowed for enrolled students. 403 Forbidden for non-enrolled students."
    requestBody:
      contentType: "application/json"
      required: false
      example:
        unread: false
    responses:
      200:
        description: "Read status updated"
        example:
          success: true
          announcementId: "ann_cs543_team_guidelines"
          isRead: true
          readByCount: 2

  # ------------------------------------------------------
  # GET /api/courses/{id}/attachments/{filename}
  # ------------------------------------------------------
  - path: "/api/courses/{id}/attachments/{filename}"
    method: "GET"
    category: "New API Introduced (Step 2)"
    service: "project-service"
    summary: "Download course or announcement attachment"
    description: "Streams requested academic document with appropriate MIME type and Content-Disposition. Access restricted to enrolled course members."
    authentication:
      required: true
      type: "Bearer JWT"
    authorization:
      rules:
        - role: "Enrolled Student / Faculty / Admin"
          rule: "Granted file download access."
        - role: "Non-enrolled Student"
          rule: "HTTP 403 Forbidden. Unauthorized users cannot download attachments."
    pathParams:
      - name: "id"
        type: "string"
        required: true
        description: "Course code or course ID"
      - name: "filename"
        type: "string"
        required: true
        description: "Name of attached document (e.g. 'Project_Guidelines.pdf')"
    responses:
      200:
        description: "Binary file stream with Content-Disposition attachment header"
        contentType: "application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      403:
        description: "Access denied"
        example:
          error: "Access denied. You are not enrolled in CS543 - Web Services."

  # ------------------------------------------------------
  # GET /api/courses/{id}/teams
  # ------------------------------------------------------
  - path: "/api/courses/{id}/teams"
    method: "GET"
    category: "New API Introduced (Step 2)"
    service: "project-service"
    summary: "List teams for course preview"
    description: "Returns preview listing of existing teams in the selected course. Accessible without team membership."
    authentication:
      required: true
      type: "Bearer JWT"
    authorization:
      rules:
        - role: "Student"
          rule: "Allowed for enrolled students regardless of team membership."
    pathParams:
      - name: "id"
        type: "string"
        required: true
        description: "Course code or course ID"
    responses:
      200:
        description: "List of course teams"
        example:
          - id: "team_alpha"
            courseCode: "CS543"
            name: "Team Alpha"
            teamLead: "Alka Jha"
            memberCount: 4
            maxMembers: 5
            status: "Joined"
            isUserMember: true
            members:
              - name: "Alka Jha"
                rollNumber: "20251651013"
                isLeader: true
              - name: "Alex Chen"
                rollNumber: "20251651001"
                isLeader: false
          - id: "team_innovators"
            courseCode: "CS543"
            name: "Team Innovators"
            teamLead: "Rohit Kumar"
            memberCount: 5
            maxMembers: 5
            status: "Full"
            isUserMember: false

  # ------------------------------------------------------
  # GET /api/courses/{id}/my-team
  # ------------------------------------------------------
  - path: "/api/courses/{id}/my-team"
    method: "GET"
    category: "New API Introduced (Step 3)"
    service: "project-service"
    summary: "Get current user's team for a course"
    description: "Returns the authenticated student's team details if they belong to a team in this course, or { team: null } if unassigned."
    authentication:
      required: true
      type: "Bearer JWT"
    pathParams:
      - name: "id"
        type: "string"
        required: true
        description: "Course code or course ID (e.g., CS543)"
    responses:
      200:
        description: "Team object or null"
        example:
          team:
            id: "team_alpha"
            courseCode: "CS543"
            name: "Team Alpha"
            description: "Distributed Microservices Architecture with Gateway"
            teamLead: "Aarav Sharma"
            memberCount: 4
            maxMembers: 5
            status: "Joined"
            isUserMember: true
            members:
              - name: "Aarav Sharma"
                rollNumber: "20251651001"
                email: "aarav1@iitv.ac.in"
                isLeader: true
      404:
        description: "Course not found"

  # ------------------------------------------------------
  # POST /api/courses/{id}/teams
  # ------------------------------------------------------
  - path: "/api/courses/{id}/teams"
    method: "POST"
    category: "New API Introduced (Step 3)"
    service: "project-service"
    summary: "Create a new course team"
    description: "Validates member identities, roll number/email consistency, batch matching, course enrollment, single-team rule, and team size (4-5 members). Caller is assigned as Team Lead."
    authentication:
      required: true
      type: "Bearer JWT"
    pathParams:
      - name: "id"
        type: "string"
        required: true
        description: "Course code or course ID (e.g., CS543)"
    requestBody:
      contentType: "application/json"
      required: true
      example:
        name: "Team Innovators"
        description: "Scalable Event Driven System"
        members:
          - rollNumber: "20251651013"
            email: "alka123@iitv.ac.in"
          - rollNumber: "20251651050"
            email: "rahul50@iitv.ac.in"
          - rollNumber: "20251651051"
            email: "sneha51@iitv.ac.in"
          - rollNumber: "20251651052"
            email: "aman52@iitv.ac.in"
    responses:
      201:
        description: "Team successfully created"
        example:
          message: "Team \"Team Innovators\" created successfully"
          team:
            id: "team_1793040000000_abc"
            courseCode: "CS543"
            name: "Team Innovators"
            description: "Scalable Event Driven System"
            teamLead: "Alka Jha"
            memberCount: 4
            maxMembers: 5
            status: "Joined"
            isUserMember: true
      400:
        description: "Validation failure (size, identity mismatch, duplicate membership, batch mismatch)"
        example:
          error: "Member with roll number 20251651050 already belongs to another team in this course."
      403:
        description: "Unauthorized or course access forbidden"

  # ------------------------------------------------------
  # POST /api/courses/{id}/teams/{teamId}/join
  # ------------------------------------------------------
  - path: "/api/courses/{id}/teams/{teamId}/join"
    method: "POST"
    category: "New API Introduced (Step 3)"
    service: "project-service"
    summary: "Join an existing course team"
    description: "Allows an unassigned enrolled student from the same batch to join an open team in the course (capacity < 5)."
    authentication:
      required: true
      type: "Bearer JWT"
    pathParams:
      - name: "id"
        type: "string"
        required: true
        description: "Course code or course ID"
      - name: "teamId"
        type: "string"
        required: true
        description: "Team ID to join"
    responses:
      200:
        description: "Successfully joined team"
        example:
          message: "You have joined team \"Team Alpha\""
          team:
            id: "team_alpha"
            memberCount: 5
            maxMembers: 5
            status: "Joined"
      400:
        description: "Team is full, or student already in a team in this course"
        example:
          error: "This team is already full (maximum 5 members)."

  # ------------------------------------------------------
  # POST /api/courses/{id}/teams/{teamId}/leave
  # ------------------------------------------------------
  - path: "/api/courses/{id}/teams/{teamId}/leave"
    method: "POST"
    category: "New API Introduced (Step 3)"
    service: "project-service"
    summary: "Leave current course team"
    description: "Allows a member to leave their team. Reassigns leadership to the next member if the team lead leaves; deletes the team if no members remain."
    authentication:
      required: true
      type: "Bearer JWT"
    pathParams:
      - name: "id"
        type: "string"
        required: true
        description: "Course code or course ID"
      - name: "teamId"
        type: "string"
        required: true
        description: "Team ID to leave"
    responses:
      200:
        description: "Successfully left team"
        example:
          message: "You have left the team."
      400:
        description: "User is not a member of this team"

  # ------------------------------------------------------
  # GET /api/courses
  # ------------------------------------------------------
  - path: "/api/courses"
    method: "GET"
    category: "Core API (Step 1)"
    service: "project-service"
    summary: "List authorized academic courses for the authenticated user"
    description: "Returns courses user is authorized to access. Supports search filtering."
    authentication:
      required: true
      type: "Bearer JWT"
    queryParams:
      - name: "search"
        type: "string"
        required: false
    responses:
      200:
        description: "Authorized courses list"

  # ------------------------------------------------------
  # GET /api/courses/{id}
  # ------------------------------------------------------
  - path: "/api/courses/{id}"
    method: "GET"
    category: "Core API (Step 1)"
    service: "project-service"
    summary: "Get course details"
    description: "Returns course code, name, faculty, semester, batch, instructor message, and resources."
    authentication:
      required: true
      type: "Bearer JWT"
    responses:
      200:
        description: "Course details"

  # ------------------------------------------------------
  # GET /api/courses/broadcasts
  # ------------------------------------------------------
  - path: "/api/courses/broadcasts"
    method: "GET"
    category: "Core API (Step 1)"
    service: "project-service"
    summary: "Aggregated faculty broadcasts"
    description: "Returns broadcast announcements across authorized courses."
    authentication:
      required: true
      type: "Bearer JWT"
    responses:
      200:
        description: "Broadcast announcements list"

  # ------------------------------------------------------
  # POST /api/auth/login
  # ------------------------------------------------------
  - path: "/api/auth/login"
    method: "POST"
    category: "Auth API"
    service: "auth-service"
    summary: "User login"
    authentication:
      required: false
    requestBody:
      contentType: "application/json"
      required: true
      example:
        email: "alka123@iitv.ac.in"
        password: "password123"
    responses:
      200:
        description: "Login successful"
      401:
        description: "Invalid credentials"

  # ------------------------------------------------------
  # Coordinator Portal: institution discovery and academic setup
  # ------------------------------------------------------
  - path: "/api/institutions"
    method: "GET"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "Search public institution directory"
    authentication: { required: false }
    queryParams:
      - { name: "search", type: "string", required: false, description: "Case-insensitive institution name search" }
    responses:
      200:
        description: "Active public institutions (maximum 50)"
        example: [{ id: "institution-id", name: "Example College", type: "college", city: "Delhi", state: "Delhi", country: "India", logoUrl: "", coverUrl: "", description: "" }]

  - path: "/api/institutions/{id}"
    method: "GET"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "Read public institution profile"
    authentication: { required: false }
    responses:
      200:
        description: "Public profile, active branches/programs, coordinator count and public coordinator profiles; excludes private contact/account fields"
      404: { description: "Institution not found or unpublished" }

  - path: "/api/institutions"
    method: "POST"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "Create an institution profile"
    authentication: { required: true, type: "Bearer JWT" }
    authorization:
      roles: ["Coordinator", "Admin"]
      rules: ["First-time coordinators may create their own institution profile; existing coordinators may update only their associated institution.", "Name and institution type (college, university, school) are required.", "Duplicate name and city returns 409; website must be http or https.", "Image links may be HTTP/HTTPS or direct PNG/JPEG/WebP uploads up to 2 MB each. Short MP4/WebM uploads are limited to 4 MB and total direct uploads to 6 MB."]
    requestBody:
      contentType: "application/json"
      required: true
      example: { name: "Example College", type: "college", city: "Delhi", state: "Delhi", country: "India", address: "", website: "https://example.edu", description: "", logoUrl: "", coverUrl: "", videoUrl: "", gallery: [] }
    responses:
      201: { description: "Institution profile created" }
      400: { description: "Required fields or website URL are invalid" }
      403: { description: "Caller lacks coordinator access" }
      409: { description: "Institution with the same name and city exists" }

  - path: "/api/coordinator/overview"
    method: "GET"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "Read coordinator dashboard data"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"], rules: ["Coordinator reads are scoped to their institution; role and institution association are loaded from the user record."] }
    responses:
      200: { description: "Institution, saved branch/batch data, counts, faculty and coordinator public profiles" }
      403: { description: "Caller is not an active coordinator or administrator" }

  - path: "/api/institutions/{id}/membership"
    method: "GET"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "Read current user's institution membership status"
    authentication: { required: true, type: "Bearer JWT" }
    responses: { 200: { description: "Membership status: none, pending, approved, or rejected" } }

  - path: "/api/institutions/{id}/membership"
    method: "POST"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "Request faculty or student membership in an institution branch"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Faculty", "Student"], rules: ["Creates a pending request for a selected active branch; never grants coordinator privileges.", "Account must not already belong to an institution."] }
    requestBody: { contentType: "application/json", required: true, example: { branchId: "branch-id" } }
    responses: { 201: { description: "Pending branch membership request created" }, 400: { description: "An active institution branch must be selected" }, 403: { description: "Only faculty or students may request membership" }, 404: { description: "Institution not found" }, 409: { description: "Account is already associated with an institution" } }

  - path: "/api/coordinator/memberships"
    method: "GET"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "List pending faculty and student branch membership requests"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"], rules: ["Coordinator sees requests for their institution only."] }
    responses: { 200: { description: "Pending requests with public member details, role, and requested branch" }, 403: { description: "Coordinator access required" } }

  - path: "/api/coordinator/memberships/{id}"
    method: "PUT"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "Approve or reject a faculty or student branch membership request"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"], rules: ["Request must be pending and in caller's institution scope.", "Approval associates the account with the requested institution and branch."] }
    requestBody: { contentType: "application/json", required: true, example: { status: "approved" } }
    responses: { 200: { description: "Membership decision saved" }, 400: { description: "Status must be approved or rejected" }, 404: { description: "Pending request not found in caller's institution" } }

  - path: "/api/coordinator/institutions/{id}"
    method: "PUT"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "Update the institution's public profile"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"], rules: ["Coordinator may update only their associated institution.", "Profile text and media links/uploads are validated.", "Gallery accepts at most 12 image entries; direct uploads follow the stated size/type limits."] }
    requestBody:
      contentType: "application/json"
      required: true
      example: { name: "Example College", type: "college", city: "Delhi", website: "https://example.edu", description: "", logoUrl: "", coverUrl: "", videoUrl: "", gallery: ["https://example.edu/campus.jpg"] }
    responses: { 200: { description: "Updated institution profile" }, 400: { description: "Invalid type, URL, or gallery size" }, 403: { description: "Institution access denied" }, 404: { description: "Institution not found" } }

  - path: "/api/coordinator/courses"
    method: "GET"
    category: "Coordinator Portal"
    service: "project-service"
    summary: "List institution courses"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"], rules: ["Coordinator sees courses with their institutionId only."] }
    responses: { 200: { description: "Institution courses with branch, batch, session, and faculty assignment fields" }, 403: { description: "Coordinator access required" } }

  - path: "/api/coordinator/courses"
    method: "POST"
    category: "Coordinator Portal"
    service: "project-service"
    summary: "Create institution course using the existing course collection"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"], rules: ["Branch, batch, and session must belong together in the same institution.", "Course code must be unique within the institution."] }
    requestBody:
      contentType: "application/json"
      required: true
      example: { name: "Web Services", code: "CS543", branchId: "branch-id", batchId: "batch-id", sessionId: "session-id", semester: "Semester 3", description: "" }
    responses: { 201: { description: "Course created" }, 400: { description: "Missing fields or incompatible academic relationships" }, 403: { description: "Institution access denied" }, 409: { description: "Course code already exists in institution" } }

  - path: "/api/coordinator/courses/{id}"
    method: "PUT"
    category: "Coordinator Portal"
    service: "project-service"
    summary: "Update an institution course"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"], rules: ["Only courses belonging to the caller's institution may be edited."] }
    requestBody: { contentType: "application/json", required: true, example: { name: "Web Services", semester: "Semester 3", description: "" } }
    responses: { 200: { description: "Course updated" }, 400: { description: "Invalid course name" }, 404: { description: "Course not found in institution" } }

  - path: "/api/coordinator/assignments"
    method: "GET"
    category: "Coordinator Portal"
    service: "project-service"
    summary: "List faculty assignments"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"], rules: ["Coordinator sees assignments for their institution only."] }
    responses: { 200: { description: "Assignment rows including faculty, course, branch, batch, session, semester, status, and timestamps" } }

  - path: "/api/coordinator/assignments"
    method: "POST"
    category: "Coordinator Portal"
    service: "project-service"
    summary: "Assign an institution faculty member to a course and batch"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"], rules: ["Faculty and course must belong to the same institution.", "Duplicate assignments are rejected.", "The existing course faculty fields are updated for compatibility with faculty course access."] }
    requestBody: { contentType: "application/json", required: true, example: { courseId: "course-id", facultyId: "faculty-user-id" } }
    responses: { 201: { description: "Assignment created" }, 400: { description: "Faculty is not an active member of the institution" }, 404: { description: "Course not found in institution" }, 409: { description: "Assignment already exists" } }

  - path: "/api/coordinator/assignments/{id}"
    method: "PUT"
    category: "Coordinator Portal"
    service: "project-service"
    summary: "Reassign a course to another institution faculty member"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"], rules: ["Assignment and replacement faculty must belong to the caller's institution."] }
    requestBody: { contentType: "application/json", required: true, example: { facultyId: "faculty-user-id" } }
    responses: { 200: { description: "Assignment updated" }, 400: { description: "Replacement faculty is not an active institution member" }, 404: { description: "Assignment not found in institution" }, 409: { description: "Assignment already exists" } }

  - path: "/api/auth/users"
    method: "POST"
    category: "Admin API"
    service: "auth-service"
    summary: "Provision a user, including an authorized institution coordinator"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Admin"], rules: ["Coordinator role cannot be self-registered.", "Admin may optionally associate the new coordinator with an existing institution by institutionId.", "If institutionId is omitted, an admin-provisioned coordinator may create their institution profile after login."] }
    requestBody:
      contentType: "application/json"
      required: true
      example: { name: "Jordan Lee", email: "jordan@example.edu", password: "initial-password", role: "Coordinator", department: "Academic Affairs", institutionId: "institution-id" }
    responses: { 201: { description: "User provisioned" }, 400: { description: "Required fields are missing" }, 403: { description: "Admin access required" }, 409: { description: "Email already exists" } }

  - path: "/api/auth/users/{id}"
    method: "PUT"
    category: "Admin API"
    service: "auth-service"
    summary: "Update a provisioned user's role or account details"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Admin"], rules: ["Only admins may assign or change the Coordinator role."] }
    requestBody: { contentType: "application/json", required: true, example: { role: "Coordinator", name: "Jordan Lee", department: "Academic Affairs" } }
    responses: { 200: { description: "User updated" }, 403: { description: "Admin access required" } }

  - path: "/api/auth/register"
    method: "POST"
    category: "Auth API"
    service: "auth-service"
    summary: "Register a Student, Faculty member, or first institution Coordinator"
    authentication: { required: false }
    authorization:
      rules:
        - "Self-registration accepts only Student, Faculty, or Coordinator. Admin cannot self-register."
        - "Coordinator registration requires institution.name and institution.type and creates the first coordinator account and institution profile together."
        - "Duplicate email or duplicate institution name and city is rejected. Institution creation does not require a pre-existing admin account."
    requestBody:
      contentType: "application/json"
      required: true
      examples:
        studentOrFaculty: { name: "Jordan Lee", email: "jordan@example.edu", password: "password", role: "Faculty", department: "Computer Science" }
        coordinator: { name: "Jordan Lee", email: "jordan@example.edu", password: "password", role: "Coordinator", department: "Academic Affairs", institution: { name: "North Valley College", type: "college", city: "Pune", state: "Maharashtra", country: "India", address: "", website: "https://example.edu", description: "", logoUrl: "", coverUrl: "" } }
    responses:
      201: { description: "Account created; for Coordinator, institution profile and institutionId are returned as well" }
      400: { description: "Required fields missing, unsupported role, invalid institution type, or invalid URLs" }
      409: { description: "Email or institution name and city already exists" }

  - path: "/api/coordinator/branches"
    method: "GET"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "List institution branches"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"] }
    responses: { 200: { description: "Branches scoped to the coordinator's institution" }, 403: { description: "Coordinator access required" } }

  - path: "/api/coordinator/branches"
    method: "POST"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "Create an institution branch and its programs"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"], rules: ["The institution must exist and be in the caller's scope.", "Duplicate branch names within an institution are rejected."] }
    requestBody:
      contentType: "application/json"
      required: true
      example: { name: "Computer Science & Engineering", code: "CSE", programs: ["B.Tech", "M.Tech"] }
    responses: { 201: { description: "Branch created" }, 400: { description: "Institution and name are required" }, 403: { description: "Institution access denied" }, 409: { description: "Branch already exists" } }

  - path: "/api/coordinator/sessions"
    method: "GET"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "List academic sessions"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"] }
    responses: { 200: { description: "Academic sessions scoped to the coordinator's institution" } }

  - path: "/api/coordinator/sessions"
    method: "POST"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "Create an academic session"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"], rules: ["Institution must be in caller's scope.", "Session name must be unique within the institution."] }
    requestBody:
      contentType: "application/json"
      required: true
      example: { name: "2026-2027", startYear: 2026, endYear: 2027 }
    responses: { 201: { description: "Academic session created" }, 400: { description: "Institution and name are required" }, 403: { description: "Institution access denied" }, 409: { description: "Session already exists" } }

  - path: "/api/coordinator/batches"
    method: "GET"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "List institution batches"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"] }
    responses: { 200: { description: "Saved batches scoped to the coordinator's institution, newest first" } }

  - path: "/api/coordinator/batches"
    method: "POST"
    category: "Coordinator Portal"
    service: "auth-service"
    summary: "Create a batch"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"], rules: ["Selected branch and session must both belong to the caller's institution.", "Duplicate batch names within the same session are rejected."] }
    requestBody:
      contentType: "application/json"
      required: true
      example: { name: "CSE 2026", branchId: "branch-id", sessionId: "session-id", cohortYear: 2026, description: "" }
    responses: { 201: { description: "Batch created with resolved branch and session names" }, 400: { description: "Required fields missing or branch/session relationship invalid" }, 403: { description: "Institution access denied" }, 409: { description: "Batch already exists for the session" } }

  - path: "/api/notifications/coordinator/branch"
    method: "POST"
    category: "Coordinator Portal"
    service: "notification-service"
    summary: "Send a message to active members of one institution branch"
    authentication: { required: true, type: "Bearer JWT" }
    authorization: { roles: ["Coordinator", "Admin"], rules: ["Coordinators can message only branches in their institution.", "Recipients are active faculty and/or students with approved membership in that branch."] }
    requestBody: { contentType: "application/json", required: true, example: { branchId: "branch-id", audience: "all", title: "Academic update", message: "Please review the updated schedule." } }
    responses:
      201: { description: "One notification created per recipient, with sent count" }
      400: { description: "Invalid audience, title, message, or no matching branch members" }
      403: { description: "Coordinator access required" }
